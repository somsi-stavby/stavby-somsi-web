name: Deploy SOMSI website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install photo enhancement tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Enhance website photos
        run: python .github/enhance-images.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Set up Java for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build SOMSI Android APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Validate SOMSI APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
      - name: Install and launch SOMSI APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop cz.somsi.app
            adb shell am start -n cz.somsi.app/.MainActivity
            sleep 5
            adb shell pidof cz.somsi.app
            adb shell dumpsys activity activities | grep -F "cz.somsi.app/.MainActivity"
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: cz.somsi.app"; then exit 1; fi
      - name: Publish SOMSI APK
        uses: actions/upload-artifact@v4
        with:
          name: STAVBY-SOMSI-APK-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
