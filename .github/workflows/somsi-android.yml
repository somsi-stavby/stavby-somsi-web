name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Validate APK
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Install APK on emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: '-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot'
          script: |
            set -e
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb wait-for-device
            i=1
            while [ "$i" -le 60 ]; do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$BOOT" = "1" ]; then
                break
              fi
              sleep 2
              i=$((i + 1))
            done
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            test "$BOOT" = "1"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n cz.somsi.stavby/cz.somsi.app.MainActivity | tee /tmp/somsi_start.txt
            grep -q 'Status: ok' /tmp/somsi_start.txt
            sleep 3
            adb shell dumpsys activity activities > /tmp/somsi_activity.txt
            adb logcat -d > /tmp/somsi_logcat.txt
            grep -q 'cz\.somsi\.app\.MainActivity' /tmp/somsi_activity.txt
            if grep -qE 'FATAL EXCEPTION|Unable to start activity' /tmp/somsi_logcat.txt; then
              echo 'Android runtime crash detected'
              cat /tmp/somsi_logcat.txt
              exit 1
            fi
            echo 'SOMSI Android launch test PASSED.'

      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: STAVBY-SOMSI-APK-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
