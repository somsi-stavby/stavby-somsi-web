name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Validate APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Install APK on emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot'
          script: |
            set -euo pipefail
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            START=$(adb shell am start -W -n cz.somsi.stavby/cz.somsi.app.MainActivity 2>&1)
            printf '%s\n' "$START"
            sleep 5
            adb shell dumpsys activity activities > /tmp/activity.txt
            adb logcat -d > /tmp/logcat.txt
            if ! printf '%s\n' "$START" | grep -q 'Status: ok'; then
              cat /tmp/logcat.txt
              exit 1
            fi
            if grep -qE 'FATAL EXCEPTION|Unable to start activity' /tmp/logcat.txt; then
              cat /tmp/logcat.txt
              exit 1
            fi
            if ! grep -q 'cz\.somsi\.app\.MainActivity' /tmp/activity.txt; then
              cat /tmp/activity.txt
              cat /tmp/logcat.txt
              exit 1
            fi
            echo 'SOMSI Android launch test PASSED.'

      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: STAVBY-SOMSI-APK-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
