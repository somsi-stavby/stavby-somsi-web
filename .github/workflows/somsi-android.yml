name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Verify APK and launcher activity
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/somsi-badging.txt
          grep -q "package: name='cz.somsi.stavby'" /tmp/somsi-badging.txt
          grep -q "launchable-activity: name='cz.somsi.app.MainActivity'" /tmp/somsi-badging.txt
          unzip -l "$APK" > /tmp/somsi-apk-list.txt
          grep -q 'classes.dex' /tmp/somsi-apk-list.txt
          grep -q 'res/drawable/realizace_hlavni.jpg' /tmp/somsi-apk-list.txt
          sha256sum "$APK"
          echo 'SOMSI Android APK structural verification PASSED.'

      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: STAVBY-SOMSI-APK-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
