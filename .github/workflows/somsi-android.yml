name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore exact reference home image
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi
          cat android/refchunks/*.b64 | tr -d '\n\r' | base64 -d > android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
          test -s android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
          file android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Validate APK archive
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: somsi-apk-installable-latest
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 10
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect'
          script: |
            set -uo pipefail
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop cz.somsi.stavby || true
            START_OUTPUT=$(adb shell am start -W -n cz.somsi.stavby/cz.somsi.app.MainActivity 2>&1 || true)
            echo "$START_OUTPUT"
            sleep 5
            adb shell dumpsys activity activities > /tmp/somsi-activity.txt || true
            adb logcat -d > /tmp/somsi-logcat.txt || true
            echo '--- ACTIVITY STATE ---'
            grep -E 'mResumedActivity|cz\.somsi\.stavby|cz\.somsi\.app\.MainActivity' /tmp/somsi-activity.txt || true
            echo '--- CRASH CHECK ---'
            grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: cz\.somsi\.stavby' /tmp/somsi-logcat.txt || true
            if grep -q 'FATAL EXCEPTION' /tmp/somsi-logcat.txt; then
              echo 'SOMSI crashed during runtime test.'
              cat /tmp/somsi-logcat.txt
              exit 1
            fi
            if ! echo "$START_OUTPUT" | grep -q 'Status: ok'; then
              echo 'Android did not report a successful Activity start.'
              exit 1
            fi
            if ! grep -q 'cz\.somsi\.app\.MainActivity' /tmp/somsi-activity.txt; then
              echo 'SOMSI MainActivity is not present in the active Android task.'
              exit 1
            fi
            echo 'SOMSI runtime smoke test passed.'
