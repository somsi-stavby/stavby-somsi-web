name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore exact reference home image
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi
          cat android/refchunks/*.b64 | tr -d '\n\r' | base64 -d > android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
          test -s android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
          file android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: somsi-apk-installable-v9
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
