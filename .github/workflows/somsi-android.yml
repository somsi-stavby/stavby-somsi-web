name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Validate APK
        run: |
          set -e
          test -s "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Install APK on emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot'
          script: |
            set -e
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n cz.somsi.stavby/cz.somsi.app.MainActivity > /tmp/somsi_start.txt 2>&1
            cat /tmp/somsi_start.txt
            sleep 5
            adb shell dumpsys activity activities > /tmp/somsi_activity.txt
            adb logcat -d > /tmp/somsi_logcat.txt
            grep -q 'Status: ok' /tmp/somsi_start.txt || { echo 'MainActivity did not report Status: ok'; exit 1; }
            grep -q 'cz\.somsi\.app\.MainActivity' /tmp/somsi_activity.txt || { echo 'MainActivity is not active'; cat /tmp/somsi_activity.txt; exit 1; }
            grep -qE 'FATAL EXCEPTION|Unable to start activity' /tmp/somsi_logcat.txt && { echo 'Android runtime crash detected'; cat /tmp/somsi_logcat.txt; exit 1; } || true
            echo 'SOMSI Android launch test PASSED.'

      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: STAVBY-SOMSI-APK-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
