name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore exact reference home image
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import base64, glob
          raw = ''.join(open(p, 'r', encoding='ascii').read() for p in sorted(glob.glob('android/refchunks/*.b64')))
          raw = ''.join(raw.split())
          raw += '=' * ((4 - len(raw) % 4) % 4)
          data = base64.b64decode(raw, validate=True)
          open('android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp','wb').write(data)
          print('reference bytes:', len(data))
          PY
          file android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: somsi-apk-installable-v8
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
