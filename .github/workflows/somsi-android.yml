name: SOMSI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/somsi-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore exact reference home image
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi
          cat android/refchunks/*.b64 | tr -d '\\n\\r' | base64 -d > android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
          test -s android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
          file android/app/src/main/res/drawable-nodpi/somsi_home_reference.webp
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Validate APK archive
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: somsi-apk-installable-v11
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n cz.somsi.stavby/cz.somsi.app.MainActivity
            sleep 8
            PID=$(adb shell pidof cz.somsi.stavby | tr -d '\\r')
            test -n "$PID"
            adb logcat -d > /tmp/somsi-logcat.txt
            if grep -q "FATAL EXCEPTION" /tmp/somsi-logcat.txt; then
              cat /tmp/somsi-logcat.txt
              exit 1
            fi
