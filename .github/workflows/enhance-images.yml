name: Optimize SOMSI website

on:
  push:
    branches: [main]
    paths:
      - 'realizace-*.jpg'
      - 'realizace-hlavni.jpg'
      - 'index.html'
      - '.github/workflows/enhance-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[somsi-speed-opt]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimize photographs for web
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          files = [Path('realizace-hlavni.jpg')] + [Path(f'realizace-{i}.jpg') for i in range(1, 7)]
          for p in files:
              if not p.exists():
                  continue
              im = Image.open(p).convert('RGB')
              max_side = 1800 if p.name != 'realizace-hlavni.jpg' else 1600
              w, h = im.size
              if max(w, h) > max_side:
                  scale = max_side / max(w, h)
                  im = im.resize((round(w * scale), round(h * scale)), Image.Resampling.LANCZOS)
              im.save(p, 'JPEG', quality=82, optimize=True, progressive=True)
          PY

      - name: Add lazy loading and image dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Browser should fetch the hero background immediately; below-the-fold <img> files are lazy.
          def add_lazy(m):
              tag = m.group(0)
              if 'loading=' in tag:
                  return tag
              return tag[:-1] + ' loading="lazy" decoding="async">'

          s = re.sub(r'<img\b[^>]*>', add_lazy, s, flags=re.I)

          # Keep the page visually identical while avoiding expensive CSS image filters.
          s = s.replace('filter:contrast(1.04) saturate(1.04);image-rendering:auto;', '')
          s = s.replace('filter:contrast(1.06) saturate(1.05);image-rendering:auto;', '')
          s = s.replace('filter:contrast(1.05) saturate(1.04);image-rendering:auto;', '')

          # Preload the hero image so the first screen appears sooner.
          marker = '<link rel="canonical" href="https://stavbysomsi.cz/">'
          preload = '<link rel="preload" as="image" href="realizace-hlavni.jpg" fetchpriority="high">'
          if preload not in s and marker in s:
              s = s.replace(marker, marker + '\n' + preload)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit optimized website
        run: |
          git config user.name 'somsi-stavby'
          git config user.email 'blehazdenda@gmail.com'
          git add realizace-*.jpg index.html .github/workflows/enhance-images.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Optimalizace rychlosti webu [somsi-speed-opt]'
          git push
